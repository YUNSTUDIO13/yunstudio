name: Supabase Keep Alive

on:
  # 建议改为每天 UTC 0 点运行，避免月末/跨月 cron 步长计算紊乱
  schedule:
    - cron: '0 0 * * *'
  
  # 允许在 GitHub Actions 页面手动点击按钮测试运行
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Send request to Supabase
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          # 确保 URL 末尾没有多余的斜杠，避免拼出 //rest/v1
          CLEAN_URL=$(echo "$SUPABASE_URL" | sed 's/*\/$//')

          # 发起 GET 请求，并设置 10 秒超时时间；即使 curl 报错，也强制给 response 赋值，防止空变量破坏 Shell 判断
          response=$(curl -s -m 10 -o /dev/null -w "%{http_code}" \
            "$CLEAN_URL/rest/v1/todos?select=count" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" || echo "000")
          
          echo "Response HTTP status: $response"
          
          # 双中括号字符串比较，防范空变量崩溃；同时只在返回 200 或 206 时判定为正常
          if [[ "$response" == "200" || "$response" == "206" ]]; then
            echo "Successfully pinged Supabase, project is kept alive!"
          elif [ "$response" == "000" ]; then
            echo "Error: Could not connect or domain failed to resolve. Check if Supabase project is Paused!"
            exit 1
          else
            echo "Failed to ping Supabase, status code: $response"
            exit 1
          fi
