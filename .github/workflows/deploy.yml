name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 允许 Actions 把构建产物发布到 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个 Pages 部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 把 Supabase 连接信息作为构建期环境变量注入（Vite 在 build 时写入前端包）
      # Secrets 需在仓库 Settings → Secrets and variables → Actions 中配置：
      #   VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # SPA 回退：GitHub Pages 不支持 history API fallback，
      # 把 index.html 复制为 404.html，使 /modules/todos 等子路由刷新时返回完整应用而非 404 空白。
      # （vite 已配置 base: './'，资源用相对引用，project 页 / 根域均可正确加载）
      - name: SPA fallback (index.html -> 404.html)
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
