    <!--
      此文件为 SPA 回退占位。
      在 GitHub Actions 部署流程中，CI 会将构建产物 dist/index.html 复制为 dist/404.html，

      若该复制步骤因故未执行，下面的兜底会刷新到站点根路径，避免白屏。
    -->
    <meta http-equiv="refresh" content="0; url=./" />
